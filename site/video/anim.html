<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../src/renderer/styles.css">
<style>
html,body{width:1280px;height:720px;margin:0;overflow:hidden;background:#000}
::-webkit-scrollbar{display:none}
.scene{position:relative;width:1280px;height:720px;overflow:hidden}
.scene .app-shell{height:720px}
.ed{flex:1;display:flex;background:var(--bg);font:13px/21px var(--mono);padding:16px 0;overflow:hidden}
.ln{width:48px;text-align:right;padding-right:18px;color:#4a4a55;white-space:pre}
.code{white-space:pre;color:#d4d4dc}
.k{color:#f5a742}.s{color:#7fe3b5}.n{color:#f59a9a}.t{color:#7aa7ff}.c{color:#5f6070;font-style:italic}.f{color:#7fe3b5}
.tree-row{pointer-events:none}
.scene .conversation{padding-top:16px;overflow:hidden}
.press{background:var(--accent-hover)!important;transform:scale(.96)}
.caret:after{content:'';display:inline-block;width:1px;height:14px;background:var(--accent);margin-left:1px;vertical-align:middle;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.hov{background:var(--surface-2)}
.err{color:var(--err)}
</style></head><body>
<div id="out"></div>
<script>
const TREE=`<div class="tree-row" style="padding-left:8px"><span class="folder-icon">▾</span> src</div>
<div class="tree-row" style="padding-left:22px"><span class="folder-icon">▾</span> electron</div>
<div class="tree-row" style="padding-left:36px"><span class="folder-icon">▾</span> agent</div>
<div class="tree-row" style="padding-left:56px">runner.ts</div>
<div class="tree-row selected" style="padding-left:56px">subagents.ts</div>
<div class="tree-row" style="padding-left:56px">context.ts</div>
<div class="tree-row" style="padding-left:56px">memory.ts</div>
<div class="tree-row" style="padding-left:22px"><span class="folder-icon">▸</span> renderer</div>
<div class="tree-row" style="padding-left:8px">package.json</div>
<div class="tree-row" style="padding-left:8px">README.md</div>`;
const LN=Array.from({length:12},(_,i)=>i+1).join('\n');
const CODE=(v='20_000')=>`<span class="c">// Read-only investigations, bounded per run</span>
<span class="k">import</span> { <span class="f">runReadOnly</span> } <span class="k">from</span> <span class="s">'./runReadOnly'</span>;

<span class="k">export const</span> <span class="t">SUBAGENT_BUDGET</span> = <span class="n" id="bud">${v}</span>;

<span class="k">export async function</span> <span class="f">delegate</span>(tasks: <span class="t">Task</span>[]) {
  <span class="k">const</span> ready = tasks.<span class="f">filter</span>(isReady);
  <span class="k">return</span> Promise.<span class="f">all</span>(ready.<span class="f">map</span>(<span class="f">runReadOnly</span>));
}

<span class="k">function</span> <span class="f">isReady</span>(task: <span class="t">Task</span>) {
  <span class="k">return</span> task.dependsOn.<span class="f">every</span>(done);
}`;
const editor=(extra='')=>`<div class="editor-tabbar"><div class="editor-tab active"><span>subagents.ts</span>${extra}</div></div><div class="ed"><div class="ln">${LN}</div><div class="code">${CODE()}</div></div>`;
const composer=(ind='')=>`<div class="composer-wrap">${ind}<div class="composer"><textarea style="pointer-events:none" placeholder="Ask about this repository"></textarea><div class="composer-foot"><span class="composer-context">subagents.ts</span><select class="composer-model"><option>gpt-5.4</option></select><button class="send-button">↑</button></div></div></div>`;
const agent=(body,foot=composer())=>`<aside class="agent-pane"><div class="agent-title"><div><strong>Agent</strong></div><div class="agent-controls"><select><option>OpenAI</option></select></div></div><div class="conversation">${body}</div>${foot}</aside>`;
const shell=(center,side,status='Ready',statusId='st')=>`<div class="app-shell editor-app"><main class="workbench" style="grid-template-columns:230px 4px minmax(0,1fr) 4px 430px"><aside class="explorer-pane"><div class="pane-title"><span>EXPLORER</span></div><div class="repo-heading"><span>code-agent</span><small>212</small></div><div class="tree-scroll">${TREE}</div></aside><div class="pane-resizer"></div><section class="editor-pane">${center}</section><div class="pane-resizer"></div>${side}</main><footer class="statusbar"><span id="${statusId}">${status}</span><span>12 lines · 0.4 KB</span></footer></div>`;
const user=(t,at)=>`<div class="message user" data-at="${at}"><div class="message-label">You</div><div class="message-text">${t}</div></div>`;
const dl=(a)=>a.map(([c,t,at])=>`<span class="diff-line ${c}" data-at="${at}">${t.replace(/</g,'&lt;')}</span>`).join('');

const scenes={
context:{dur:4.6,html:shell(editor(),agent(`${user('Why does the runner stop after the tool limit?',0.3)}
<div class="message" data-at="0.8"><div class="message-label">Agent</div>
<details class="source-block" open><summary>On-disk context · 3 excerpt(s)</summary><ul><li data-at="1.0">src/electron/agent/runner.ts:88–131 <small>(matches "tool limit")</small></li><li data-at="1.3">src/electron/agent/context.ts:1–40 <small>(selected file)</small></li><li data-at="1.6">README.md:12–30 <small>(related)</small></li></ul></details>
<details class="source-block" open data-at="1.9"><summary>Project memory · 2 item(s)</summary><ul><li>Testing approach</li><li data-at="2.2">Turn limits</li></ul></details>
<div class="message-text markdown-body" data-at="2.5"><p>The runner counts turns, not tool calls, and stops at the configured maximum.</p></div></div>`,
composer(`<button class="context-indicator" id="ind" type="button"><span>Context</span><strong id="tok">— / 100k</strong><span id="flag"></span></button>`)),'Ready'),
 hook:t=>{const p=Math.max(0,Math.min(1,(t-0.9)/2.2));const v=18.4+(61.2-18.4)*p;const tok=document.getElementById('tok');tok.textContent=(t<0.9?'—':v.toFixed(1)+'k')+' / 100k';const warn=t>=3.2;const ind=document.getElementById('ind');ind.className='context-indicator'+(warn?' warning':'');document.getElementById('flag').textContent=warn?'Near budget':(t>=2.9?'Compacted':'');}},

memory:{dur:5,html:shell(editor(),`<aside class="agent-pane"><div class="agent-title"><div><strong>Agent</strong></div></div><div class="conversation side-list memory-panel">
<div class="memory-heading"><div><div class="side-list-title">Project memory</div><div class="side-list-context">code-agent</div></div><button id="addbtn">Add</button></div>
<p class="memory-help">Facts you explicitly save here can be used in relevant future prompts. They are separate from chat history and stored locally, unencrypted. Do not save secrets.</p>
<form class="memory-form" id="form" data-at="1.4" data-out="3.4"><label>Topic<input id="topic" placeholder="e.g. Testing approach"></label><label>Fact or decision<textarea id="val" placeholder="What should the agent remember?"></textarea></label><div class="memory-actions"><button type="button">Cancel</button><button type="button" class="primary" id="savebtn">Save</button></div></form>
<section class="memory-item" data-at="0.2"><div class="memory-item-title"><strong>Testing approach</strong><label><input type="checkbox" checked> Use</label></div><p>Tests build the main process first, then run node --test against temporary workspaces.</p><small>Your note · updated 11/1/2026</small><div class="memory-actions"><button>Edit</button><button class="danger">Delete</button></div></section>
<section class="memory-item" data-at="0.5"><div class="memory-item-title"><strong>Turn limits</strong><label><input type="checkbox" checked> Use</label></div><p>The runner stops at the configured turn maximum; sub-agents never recurse.</p><small>File reference · src/electron/agent/runner.ts</small><div class="memory-actions"><button>Edit</button><button class="danger">Delete</button></div></section>
<section class="memory-item" id="newitem" data-at="3.5"><div class="memory-item-title"><strong>Release checklist</strong><label><input type="checkbox" checked> Use</label></div><p>Build, run the tests, then package the portable exe.</p><small>Your note · updated today</small><div class="memory-actions"><button>Edit</button><button class="danger">Delete</button></div></section>
</div></aside>`,'Project memory'),
 hook:t=>{const T='Release checklist',V='Build, run the tests, then package the portable exe.';const a=Math.max(0,Math.min(1,(t-1.6)/0.8)),b=Math.max(0,Math.min(1,(t-2.3)/1.0));document.getElementById('topic').value=T.slice(0,Math.round(a*T.length));document.getElementById('val').value=V.slice(0,Math.round(b*V.length));document.getElementById('addbtn').classList.toggle('press',t>1.1&&t<1.4);document.getElementById('savebtn').classList.toggle('press',t>3.1&&t<3.4);}},

commands:{dur:5,html:shell(editor(),agent(`${user('Run the tests, then commit.',0.2)}
<div class="message" data-at="0.6"><div class="message-label">Agent</div>
<details class="tool-step" open><summary><span>run_diagnostic · test</span><small id="rd">Running</small></summary><div class="tool-description">Selected the existing <code>test</code> package script. Ran in the workspace root.</div><pre id="out1"></pre></details></div>
<section class="approval-inline" data-at="3.0"><div class="approval-inline-heading"><strong>run command</strong><span>git</span></div><p>Runs an executable directly — no shell. Working directory: workspace root. Stops after 60s or on cancel.</p>
<details open><summary>Review command</summary><div class="approval-inline-code"><div><strong>Arguments</strong><pre>["commit", "-m", "Add retry to stream request"]</pre></div></div></details>
<div class="approval-inline-actions"><button>Reject</button><button class="primary" id="allow">Allow once</button></div></section>`),'Running tests'),
 hook:t=>{const lines=['# tests 41','# pass 41','# fail 0','# duration_ms 6180'];const n=Math.max(0,Math.min(4,Math.floor((t-1.0)/0.4)));document.getElementById('out1').style.display=n?'':'none';document.getElementById('out1').textContent=lines.slice(0,n).join('\n');document.getElementById('rd').textContent=t<2.7?'Running':'Done';document.getElementById('allow').classList.toggle('press',t>4.3&&t<4.7);}},

git:{dur:4.6,html:shell(editor(),agent(`${user('What have I changed so far?',0.2)}
<div class="message" data-at="0.6"><div class="message-label">Agent</div>
<details class="tool-step" open><summary><span>git_status</span><small>Done</small></summary><pre>branch: master
<span data-at="0.9">staged:    1 file</span>
<span data-at="1.1">unstaged:  2 files</span>

<span data-at="1.3">M  src/electron/agent/providers/openai.ts</span>
<span data-at="1.5"> M src/renderer/styles.css</span>
<span data-at="1.7"> M src/renderer/Editor.tsx</span></pre></details>
<details class="tool-step" open data-at="2.1"><summary><span>git_diff · unstaged · Editor.tsx</span><small>Done</small></summary><div class="approval-diff">${dl([['diff-file','--- a/src/renderer/Editor.tsx',2.3],['diff-hunk','@@ -36,7 +36,12 @@',2.5],['diff-remove',"-        'editor.background': '#000000',",2.7],['diff-add',"+        'editor.background': '#09090b',",2.9],['diff-add',"+        'editorCursor.foreground': '#f5a742',",3.1]])}</div></details>
<div class="message-text markdown-body" data-at="3.5"><p>One staged change in the provider, and two unstaged UI edits. Nothing was modified — these tools are read-only.</p></div></div>`),'Done'),hook:()=>{}},

editor:{dur:5,html:shell(`<div class="editor-tabbar"><div class="editor-tab"><span>runner.ts</span></div><div class="editor-tab active"><span>subagents.ts</span><i class="dirty-dot" id="dirty" style="display:none"></i></div><div class="editor-tab"><span>context.ts</span></div></div><div class="ed"><div class="ln">${LN}</div><div class="code">${CODE()}</div></div>`,
`<aside class="agent-pane"><div class="agent-title"><div><strong>Agent</strong></div></div><div class="conversation"><div class="message" data-at="3.4"><div class="message-label">Save blocked</div><div class="message-text markdown-body"><p><code>subagents.ts</code> changed on disk after you opened it. Saving would overwrite those changes, so it was refused.</p></div></div></div></aside>`,'Ready'),
 hook:t=>{const target='30_000';const p=Math.max(0,Math.min(1,(t-0.6)/1.2));const typed=target.slice(0,Math.round(p*target.length));document.getElementById('bud').textContent=p<=0?'20_000':typed+(p<1?'':'');document.getElementById('dirty').style.display=t>=0.9?'':'none';document.getElementById('st').textContent=t<2.6?'Ready':t<3.4?'Saving…':'subagents.ts changed on disk — save refused';document.getElementById('st').style.color=t>=3.4?'var(--err)':'';}},

history:{dur:4.6,html:shell(editor(),`<aside class="agent-pane"><div class="agent-title"><div><strong>Agent</strong></div><div class="agent-controls"><button class="icon-button active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"/></svg></button></div></div><div class="conversation side-list">
<div class="side-list-title">Recent chats</div>
<div class="recent-row" data-at="0.3"><button><strong>Retry the request when the stream drops</strong><span>code-agent · 11/2/2026</span></button></div>
<div class="recent-row" id="row2" data-at="0.6"><button><strong>Where is the token budget enforced?</strong><span>code-agent · 11/2/2026</span></button></div>
<div class="recent-row" data-at="0.9"><button><strong>Split App.tsx into components</strong><span>code-agent · 10/30/2026</span></button></div>
<div class="recent-row" data-at="1.2"><button><strong>Why does the runner stop early?</strong><span>portfolio · 10/27/2026</span></button></div>
<div class="side-list-title" style="margin-top:24px" data-at="1.8">Allowed actions · code-agent</div>
<div class="permission-row" data-at="2.0"><span>edit file</span><button class="icon-button">✕</button></div>
<div class="permission-row" id="perm2" data-at="2.2"><span>create file</span><button class="icon-button" id="x2">✕</button></div>
</div></aside>`,'Chats are saved locally'),
 hook:t=>{document.getElementById('row2').classList.toggle('hov',t>1.5&&t<2.0);document.getElementById('x2').classList.toggle('press',t>3.2&&t<3.5);const p=document.getElementById('perm2');if(t>=3.5){p.style.opacity=Math.max(0,1-(t-3.5)/0.4);if(t>3.9)p.style.display='none'}}}
};

function setScene(name){
  const out=document.getElementById('out');out.innerHTML='';const d=document.createElement('div');d.className='scene';d.innerHTML=scenes[name].html;out.appendChild(d);window.cur=name;
}
function setT(t){
  document.querySelectorAll('[data-at]').forEach(e=>{
    const at=+e.dataset.at,o=e.dataset.out?+e.dataset.out:1e9;
    if(t<at||t>=o){e.style.display='none';return}
    e.style.display='';const k=Math.min(1,(t-at)/0.3);
    if(e.id!=='perm2'){e.style.opacity=k;e.style.transform=`translateY(${(1-k)*6}px)`}
  });
  scenes[window.cur].hook(t);
  document.querySelectorAll('.conversation').forEach(c=>c.scrollTop=c.scrollHeight);
}
window.names=Object.keys(scenes);window.durs=Object.fromEntries(Object.entries(scenes).map(([k,v])=>[k,v.dur]));
</script></body></html>
